name: Publish to npm

# Publishes on a pushed version tag (e.g. v0.1.0) using npm Trusted Publishing
# (OIDC) — no npm token stored in the repo; provenance is attached.
# Also creates the GitHub Release with notes from CHANGELOG.md, which the
# Homebridge Verified program requires for every version.
#
# One-time setup:
#   1. npm requires the package to EXIST before a trusted publisher can be
#      added, so the first publish is manual: `npm login && npm publish`.
#   2. npmjs.com > @nimbio/homebridge-nimbio > Settings > Trusted Publisher:
#      GitHub Actions, repository nimbio-labs/homebridge-nimbio, workflow publish.yml.

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release
      id-token: write # OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Pinned: trusted publishing needs npm >= 11.5.1. Bump deliberately.
      - name: Upgrade npm
        run: npm install -g npm@11.19.1

      - name: Verify the pushed tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm publish --provenance

      - name: GitHub Release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
